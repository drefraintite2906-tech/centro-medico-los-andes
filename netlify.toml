# Configuración de publicación en Netlify (plan gratuito)
[build]
  command = "npm run build"
  publish = "_site"
  # Ahorro de créditos: solo publica si cambió algo que forma parte del sitio.
  # (Cambios en material-impreso/, herramientas/ o documentación NO generan publicación.)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src/ eleventy.config.js package.json package-lock.json netlify.toml"

[build.environment]
  NODE_VERSION = "22"

# Redirigir el dominio sin www hacia www (ajuste cuando conecte su dominio)
# [[redirects]]
#   from = "https://centromedicolosandes.com/*"
#   to = "https://www.centromedicolosandes.com/:splat"
#   status = 301
#   force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# "Mi control de salud": el service worker y el manifiesto deben revisarse en cada visita
[[headers]]
  for = "/mi-salud/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/mi-salud/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
