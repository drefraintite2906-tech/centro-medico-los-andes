# Publica la aplicación "Mi control de salud" (carpeta app-pacientes/) en GitHub Pages.
# Gratis para repositorios públicos y no usa créditos de Netlify.
# Requisito (una sola vez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar app de pacientes

on:
  push:
    branches: [main]
    paths:
      - "app-pacientes/**"
      - ".github/workflows/app-pacientes.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app-pacientes
      - id: deployment
        uses: actions/deploy-pages@v4
